<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support desk work sample</title>
<style>
  body { font: 16px system-ui; margin: 32px auto; max-width: 1000px; padding: 0 20px; color: #182231; background: #f6f7f9; }
  h1 { font-size: 25px; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 30px; }
  button, select, textarea { font: inherit; padding: 9px; margin: 4px 0; }
  button { cursor: pointer; }
  textarea { width: 95%; min-height: 100px; }
  #notice { min-height: 25px; font-weight: 600; }
  #next { background: #fff8e8; border: 1px solid #e2d3a4; padding: 12px; }
  .panel { background: white; padding: 14px; border: 1px solid #d5dae2; }
  .panel p { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  li { margin: 10px 0; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  small { color: #586577; }
  @media (max-width: 650px) { main { display: block; } }
</style>
<h1>Support desk work sample</h1>
<p>Fictional customers. Local exercise. No real messages are sent.</p>
<label>Signed in as
  <select id="identity">
    <option value="alpha">Alpha support agent</option>
    <option value="beta">Beta support agent</option>
  </select>
</label>
<p id="notice" role="status"></p>
<main>
  <section>
    <h2>Inbox</h2>
    <button id="refresh">Refresh</button>
    <ul id="tickets"></ul>
  </section>
  <section>
    <h2 id="title">Select a ticket</h2>
    <p id="state"></p>
    <div id="work" hidden>
      <h3>Next safe action</h3>
      <p id="next"></p>
      <h3>Conversation</h3>
      <div id="messages" class="panel"></div>
      <label for="draft">Reply draft</label>
      <textarea id="draft"></textarea>
      <small>The suggested reply is a fixed fixture. Saving it does not approve it.</small>
      <div class="buttons">
        <button data-action="suggest">Use suggested reply</button>
        <button data-action="draft">Save draft</button>
        <button data-action="approve">Approve saved draft</button>
        <button data-action="send">Send manually</button>
        <button data-action="handoff">Take over</button>
        <button data-action="automation">Simulate automation</button>
        <button data-action="reconcile">Check delivery</button>
      </div>
      <h3>Delivery</h3>
      <div id="attempts" class="panel"></div>
      <h3>Audit trail</h3>
      <div id="audit" class="panel"></div>
    </div>
  </section>
</main>
<script type="module">
let selected;
const $ = (id) => document.getElementById(id);
const auditLabels = {
  inbound: 'Customer message stored',
  draft_updated: 'Draft saved',
  approved: 'Draft approved',
  human_handoff: 'Human took over',
  delivery_claimed: 'Delivery attempt recorded before the provider answered',
  delivery_unconfirmed: 'Provider did not confirm delivery',
  delivery_rejected: 'Provider rejected the reply before accepting it',
  sent: 'Provider confirmed delivery',
  reconciled: 'Provider confirmed this same attempt',
  reconcile_inconclusive: 'Provider has no record of this attempt. That does not prove it failed',
  reconcile_unavailable: 'Delivery check failed. The attempt stays uncertain'
};

async function api(path, method = 'GET', body) {
  const response = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer demo-' + $('identity').value + '-token'
    },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const data = await response.json();
  if (!response.ok) throw Error(data.error);
  return data;
}

function paragraph(parent, text) {
  const line = document.createElement('p');
  line.textContent = text;
  parent.append(line);
}

function render(ticket) {
  $('work').hidden = false;
  $('title').textContent = ticket.subject + ' · ' + ticket.contact;
  const approved = ticket.approved_version === ticket.version && ticket.draft
    ? 'approved version ' + ticket.version
    : 'not approved';
  $('state').textContent = 'Owner: ' + ticket.owner + ' | Delivery: ' + ticket.send_state + ' | Draft version ' + ticket.version + ' | ' + approved;
  $('next').textContent = ticket.nextAction;
  $('draft').value = ticket.draft;
  const messages = $('messages');
  messages.replaceChildren();
  if (!ticket.messages.length) paragraph(messages, 'No inbound messages yet. Run npm run event.');
  for (const message of ticket.messages) paragraph(messages, message.body);
  const attempts = $('attempts');
  attempts.replaceChildren();
  if (!ticket.attempts.length) paragraph(attempts, 'No delivery attempts yet.');
  for (const attempt of ticket.attempts) {
    paragraph(attempts, 'Version ' + attempt.version + ': ' + attempt.state + ' (ref ' + attempt.client_ref + ')');
  }
  const audit = $('audit');
  audit.replaceChildren();
  if (!ticket.audit.length) paragraph(audit, 'No actions yet.');
  for (const entry of ticket.audit) {
    paragraph(audit, (auditLabels[entry.action] || entry.action) + ' — ' + entry.detail);
  }
}

async function refresh() {
  const rows = await api('/api/tickets');
  $('tickets').replaceChildren();
  for (const ticket of rows) {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.textContent = ticket.id + ': ' + ticket.contact + ' (' + ticket.send_state + ')';
    button.onclick = () => act(async () => {
      selected = ticket.id;
      render(await api('/api/tickets/' + selected));
    });
    item.append(button);
    $('tickets').append(item);
  }
}

async function act(fn) {
  try {
    $('notice').textContent = '';
    await fn();
  } catch (error) {
    $('notice').textContent = error.message;
    if (selected) {
      try { render(await api('/api/tickets/' + selected)); } catch { /* Keep the error above. */ }
    }
  }
}

$('refresh').onclick = () => act(refresh);
$('identity').onchange = () => {
  selected = undefined;
  $('work').hidden = true;
  $('title').textContent = 'Select a ticket';
  $('state').textContent = '';
  act(refresh);
};

for (const button of document.querySelectorAll('[data-action]')) {
  button.onclick = () => act(async () => {
    const action = button.dataset.action;
    // The fixture only fills the box. The server still requires save, then approval.
    if (action === 'suggest') {
      $('draft').value = 'Thanks for reaching out. A support agent will help you recover your progress.';
      $('notice').textContent = 'Suggestion placed in the draft. Save it, then approve that exact text.';
      return;
    }
    const ticket = await api('/api/tickets/' + selected + '/' + action, 'POST', action === 'draft' ? { body: $('draft').value } : {});
    render(ticket);
    $('notice').textContent = ticket.nextAction;
  });
}

act(refresh);
</script>
</html>
